# Dev config: single 5070 Ti, spec 2.1 column 1.
extends: ../base.yaml

d_model: 768
n_units: 3                 # 3 x (C,C,C,A) = 12 blocks

mixer:
  type: cfc                # A1 swaps this for gated_conv (B3) or lru (B4)
  d_inner: 1152            # 1.5 x d_model
  n_decay_heads: 12        # 96 channels per lambda; == d_inner would be per-channel
  conv_kernel: 4           # DWConv_k4
  delta_aware: true        # A3 control arm sets this false (Delta pinned to 1)
  a_min: 0.9               # spec 3: a at Delta=1 is log-uniform in [a_min, a_max]
  a_max: 0.999             # the stability lever; A6 sweeps it

n_heads: 12
n_kv_heads: 4
head_dim: 64
window: 512

ffn:
  type: dense
  d_ff: 2048
