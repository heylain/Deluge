# Target v1, dense FFN: spec 2.1 column 2.
extends: ../base.yaml

d_model: 2048
n_units: 6                 # 6 x (C,C,C,A) = 24 blocks

mixer:
  type: cfc
  d_inner: 3072
  n_decay_heads: 16        # 192 channels per lambda
  conv_kernel: 4
  delta_aware: true        # A3 control arm sets this false (Delta pinned to 1)

n_heads: 16
n_kv_heads: 4
head_dim: 128
window: 2048

ffn:
  type: dense
  d_ff: 5632

# Spec 2.1 lists rho 0.5 for the target configs: MoD is part of the target
# architecture, not an ablation. dev.yaml leaves it null because the dev ladder
# starts at A0 and switches it on at A3.
mod:
  capacity: 0.5
  every_n_units: 2         # units 1, 3, 5 of 6
  threshold: 0.5
