# Every knob the model takes. Model configs extend this and override shapes.
# No hyperparameter lives in Python: this file is the source of truth.

vocab_size: 32000          # reused 32k BPE tokenizer (spec 7)
tie_embeddings: true       # unembedding shares the embedding matrix

chunk: 64                  # C: summary granularity; window must be a multiple
n_sink: 4                  # learned, never-evicted KV pairs per KV head (spec 5)

# Offsets, relative to the attention layer, of the CfC layers whose state feeds
# the chunk summary. (-1,) is "the immediately preceding CfC layer" (spec 5).
# Spec 16 leaves "every CfC layer" open; it is this list, not a code change.
summary_sources: [-1]

# Mixture-of-Depths. Off by default: the ladder starts at A0 (no MoD) and the
# A3 configs switch it on. Set to a block to enable:
#   mod:
#     capacity: 0.5          # rho, fraction of tokens processed
#     every_n_units: 2       # gate every second unit, starting at the second
#     threshold: 0.5         # causal predictor cutoff (the tier 0/1 dial)
mod: null

# Multi-token prediction head (spec 7). Off by default for the same reason as
# MoD: the ladder starts at A0 and A4 is the rung that adds it. Set to a block
# to enable:
#   mtp:
#     depth: 1               # 2 is the A6 ablation
#     share_trunk_block: false   # the M3 question of spec 16, decided at A4
mtp: null
