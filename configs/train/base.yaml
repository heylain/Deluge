# Every knob the training loop takes. Run configs extend this and override the
# budget. As with the model configs: no hyperparameter lives in Python.
#
# Paths (data, output, resume search dirs) are deliberately absent -- they are
# environment, not hyperparameters, and differ between Kaggle and local. They
# are CLI arguments so that a config file is portable between the two.

# 4096 because A1's claim is about long-range state (M1 design D5): at 1024 the
# stacked 512-token windows of blocks 4, 8 and 12 already span the sequence,
# and A1 would test only local mixing. The data comes in pieces of
# seq_len + 1 tokens, one document each (docs/kaggle.md, "Data").
seq_len: 4096

# Tokens consumed per optimizer step. This, not micro_batch, defines the
# optimization: micro_batch only says how the step is chunked to fit in VRAM,
# and grad_accum is derived from the two. Moving between a T4 and a 4090 should
# change micro_batch and nothing else -- the loss curve must not notice.
global_batch_tokens: 262144    # 64 sequences of 4096
# Sequences per forward, split over both T4s by --data-parallel, so twice the
# per-GPU size. A power of two, so it divides the 64 sequences of a step; set
# by the M1 local smoke (docs/kaggle.md, "Memory").
micro_batch: 4                 # 16 accumulation steps

total_tokens: 500_000_000

# Optimizer. AdamW, beta2 0.95 (short-horizon second moment, standard below 1B).
# Spec 7: peak 3e-4, and 6e-4 at dev scale. Everything that extends this file is
# dev-scale; a target-run budget overrides lr back down to 3.0e-4.
lr: 6.0e-4
min_lr_ratio: 0.1              # cosine floor, as a fraction of lr
warmup_tokens: 10_000_000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# Auxiliary loss weights (spec 7):
#   L = L_ce + mtp_weight * L_mtp + mod_pred_weight * L_mod_pred
#            + router_z_weight * L_z(mod router) [+ L_z(moe router) in v2]
# They live here rather than in the model config because they are objective, not
# architecture: the same model config trains under different weights. A term
# whose block is absent (no `mtp:`, no `mod:`) contributes nothing, so these stay
# set across the whole ladder and only start mattering at A3 and A4.
mtp_weight: 0.3
mtp_weight_final: 0.1        # annealed down over the run's last stretch
mtp_anneal_from: 0.6         # fraction of the run at which the anneal starts
mod_pred_weight: 0.01        # causal skip predictor BCE
router_z_weight: 1.0e-3      # router logit z-loss, MoD and (v2) MoE alike

# fp16 because Kaggle's T4 is sm_75: Turing has fp16 tensor cores but no bf16
# ones, so bf16 there falls back to emulation and runs slower than fp32. fp16
# carries 10 mantissa bits against bf16's 7, which is the favourable direction
# for the log-domain lambda of spec 3; the cost is range, handled by the loss
# scaler. Set bf16 on anything sm_80 or newer (A100, 4090, 5070 Ti, H100).
dtype: fp16

seed: 1234

# Checkpoint cadence in tokens, so it is independent of batch shape. Kaggle
# kills a session at 12h; deadline_minutes makes the run checkpoint and exit
# cleanly before that rather than losing the partial step. null = no deadline.
checkpoint_every_tokens: 25_000_000
keep_last: 2

# Held-out eval cadence in tokens, on the first ~2M tokens of heldout.bin. null
# turns the in-run evals off; the final eval on the whole held-out set still
# runs whenever heldout.bin sits next to the training data, and the run only
# completes once it has (deluge/train/loop.py). The budgets set it.
eval_every_tokens: null
deadline_minutes: 660
